<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dayflow - HRMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #111827;
            color: white;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .section {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        @media(max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">DAYFLOW</div>
    <button onclick="logout()">Logout</button>
</nav>

<div class="container">

    <div class="welcome">
        <h1>Good Morning 👋</h1>
        <p>Welcome to your Dayflow HR dashboard.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Attendance</h3>
            <div class="number">22</div>
            <p>Present Days</p>
        </div>

        <div class="card">
            <h3>Leave Balance</h3>
            <div class="number">8</div>
            <p>Days Remaining</p>
        </div>

        <div class="card">
            <h3>Pending Leaves</h3>
            <div class="number">2</div>
            <p>Requests</p>
        </div>

        <div class="card">
            <h3>Payroll</h3>
            <div class="number">₹29K</div>
            <p>Net Salary</p>
        </div>

    </div>

    <div class="section">

        <h2>Today's Attendance</h2>

        <br>

        <p id="attendance">
            Check-in: Not checked in
        </p>

        <div class="actions">

            <button onclick="checkIn()">
                Check In
            </button>

            <button onclick="checkOut()">
                Check Out
            </button>

        </div>

    </div>

    <div class="section">

        <h2>Quick Actions</h2>

        <div class="actions">

            <button onclick="applyLeave()">
                Apply Leave
            </button>

            <button onclick="viewProfile()">
                View Profile
            </button>

        </div>

    </div>

</div>

<script>

function checkIn() {

    const time = new Date().toLocaleTimeString();

    document.getElementById("attendance").innerText =
        "Check-in: " + time;

}

function checkOut() {

    const time = new Date().toLocaleTimeString();

    document.getElementById("attendance").innerText =
        "Check-out: " + time;

}

function applyLeave() {

    alert("Leave application module coming soon!");

}

function viewProfile() {

    alert("Employee Profile");

}

function logout() {

    alert("Logged out successfully!");

}

</script>

</body>
</html>
